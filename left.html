<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>left content</title>
    <link rel="stylesheet" href="left.css">

    <style>
        /* CSS untuk Left Content */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        fieldset {
            border: 2px solid #4D4D4D;
            border-radius: 10px;
            padding: 15px;
            background-color: white;
            max-width: 250px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        legend {
            font-weight: bold;
            color: #4D4D4D;
            font-size: 1em;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin: 10px 0;
        }

    </style>
</head>
<body>
    <fieldset>
        <legend>Teman di Sosmed</legend>
        <ul>
            <li><a href="#">Teman 1</a></li>
            <li><a href="#">Teman 2</a></li>
            <li><a href="#">Teman 3</a></li>
            <li><a href="#">Teman 4</a></li>
            <li><a href="#">Teman 5</a></li>
        </ul>
    </fieldset>
</body>
</html>
