<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Navigasi</title>
    <link rel="stylesheet" href="nav.css">
    <style>
        /* CSS untuk Menu Navigasi */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 5px;
            background-color: #f4f4f4;
        }

        fieldset {
            border: 2px solid #4D4D4D;
            border-radius: 10px;
            padding: 10px;
            background-color: white;
            max-width: 250%;
        }

        legend {
            font-weight: bold;
            color: #4D4D4D;
        }

        ul {
            list-style-type: none;
            padding: 0;
            display: flex;
        }

    </style>
</head>
<body>
    <fieldset>
        <legend>Menu</legend>
        <ul>
            <li><a href="./indentitas/home.html" target="main_content">Home</a></li>
            <li><a href="./indentitas/study.html" target="main_content">My Study</a></li>
            <li><a href="./indentitas/gallery.html" target="main_content">Gallery</a></li>
        </ul>
    </fieldset>
</body>
</html>
