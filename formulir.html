<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Ujian</title>
    <script>
        function periksaNilai() {
            // Ambil data dari input
            var nama = document.getElementById("nama").value;
            var email = document.getElementById("email").value;
            var nilai = parseInt(document.getElementById("nilai").value);

            // Cek jika nilai ujian > 70 atau < 70
            var hasil;
            if (nilai > 70) {
                hasil = "Lulus";
            } else {
                hasil = "Remedial";
            }

            // Tampilkan hasilnya
            document.getElementById("hasil").innerHTML = "Nama: " + nama + "<br>Email: " + email + "<br>Nilai Ujian: " + nilai + "<br>Hasil: " + hasil;
        }
    </script>
</head> 
<body style="position: absolute;">
    <h2>Formulir Ujian</h2>
    <form onsubmit="event.preventDefault(); periksaNilai();">
        <label for="nama">Nama:</label><br>
        <input type="text" id="nama" required><br><br>
        
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" required><br><br>
        
        <label for="nilai">Nilai Ujian:</label><br>
        <input type="number" id="nilai" required><br><br>
        
        <input type="submit" value="Periksa Nilai">
    </form>

    <h3>Hasil:</h3>
    <div id="hasil"></div>
</body>
</html>
